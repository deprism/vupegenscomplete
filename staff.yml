punishment-presets:
  spam:
    display: "<yellow>Spam / Flood"
    icon: PAPER
    action: MUTE
    duration: 15m
    reason: "Spam / flooding chat"
  toxicity:
    display: "<gold>Toxicity"
    icon: BLAZE_POWDER
    action: MUTE
    duration: 1h
    reason: "Toxic or abusive chat"
  slurs:
    display: "<red>Slurs / Hate Speech"
    icon: REDSTONE
    action: MUTE
    duration: 12h
    reason: "Hate speech / slurs"
  griefing:
    display: "<#F472B6>Griefing"
    icon: TNT
    action: BAN
    duration: 3d
    reason: "Griefing / destructive behavior"
  cheating:
    display: "<#A78BFA>Cheating"
    icon: DIAMOND_SWORD
    action: BAN
    duration: 14d
    reason: "Unfair client / cheating"
  advertising:
    display: "<#22D3EE>Advertising"
    icon: OAK_SIGN
    action: MUTE
    duration: 6h
    reason: "Unauthorized advertising"
  permanent:
    display: "<dark_red>Permanent Ban"
    icon: BARRIER
    action: BAN
    duration: permanent
    reason: "Severe / repeated rule violations"
