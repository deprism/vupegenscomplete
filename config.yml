config-version: 1
profile: MAX_QUALITY
server:
  name: Vupe
  recommended-player-cap: 100
  debug: false
  save-interval-seconds: 60
  leaderboard-refresh-seconds: 30
  scoreboard-refresh-ticks: 20
  generator-cycle-ticks: 20
  item-merge-radius: 2.75
  maximum-generated-items-per-chunk: 500
setup:
  wizard-on-first-op-join: true
  create-worlds-automatically: false
  safe-mode-until-complete: true
  required-points:
  - spawn
  - fishing
  - mine
  - crates
storage:
  type: JSON
  player-folder: data/players
  server-file: data/server.json
  atomic-writes: true
integrations:
  economy:
    provider: VUPE_NATIVE
    vault-provider: VupeCore
  native-systems:
    shop: VupeCore
    auction: VupeCore
    crates: VupeCore
    money: VupeCore
