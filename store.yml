    - gens give %player% amethyst 4
    - vupegrant %player% crate:cipher:5
    - vupegrant %player% crate:phantom:3
    overdrive_store:
    - crystaleco give %player% 200000
    - gens give %player% rift 5
    - vupegrant %player% crate:titan:5
    - vupegrant %player% crate:vupe:2
    founder:
    - crystaleco give %player% 500000
    - gens give %player% zenith 5
    - vupegrant %player% crate:vupe:5
    - vupegrant %player% rank:vupeplus
    keys_small:
    - vupegrant %player% crate:vote:10
    - vupegrant %player% crate:cipher:5
    keys_large:
    - vupegrant %player% crate:cipher:10
    - vupegrant %player% crate:phantom:7
    - vupegrant %player% crate:titan:3
    keys_mythic:
