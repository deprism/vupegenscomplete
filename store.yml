    - gens give %player% nova 5
    - gens give %player% quantum 3
    tagpack:
    - vupegrant %player% tag:grinder
    - vupegrant %player% tag:og
    - vupegrant %player% tag:void
    seasonpass:
    - lp user %player% permission set vupe.season.premium true
